name: Weekly Value Scan
on:
  schedule:
    - cron: '0 23 * * 5'  # UTC周五23:00 = 墨尔本周六早上9点
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py
      - run: |
          git config user.name "value-bot"
          git config user.email "bot@value.local"
          git add docs/data.json
          git commit -m "weekly update $(date)" || echo "no changes"
          git push