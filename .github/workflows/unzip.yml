name: unzip fix
on: workflow_dispatch
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls -la
          python3 - << 'PY'
          import zipfile, pathlib, os
          zips = list(pathlib.Path('.').glob('*.zip'))
          print("Found:", zips)
          for zp in zips:
              print(f"Extracting {zp}")
              with zipfile.ZipFile(zp) as z:
                  z.extractall('.')
          PY
          rm -f *.zip
          git config user.name "fix-bot"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "fix folders" || echo "no changes"
          git push
