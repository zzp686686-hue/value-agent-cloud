name: fix indent
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "[STRIPPED 1272 bytes]" | base64 -d > src/edgar_fetcher.py
          echo "[STRIPPED 1312 bytes]" | base64 -d > src/financials.py
          echo "[STRIPPED 608 bytes]" | base64 -d > src/report_generator.py
          echo "[STRIPPED 924 bytes]" | base64 -d > src/universe.py
          echo "[STRIPPED 1184 bytes]" | base64 -d > src/valuation.py
          git config user.name "fix-bot"
          git config user.email "bot@github.com"
          git add src/
          git commit -m "fix indent" || true
          git push
